name: CF fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cf-fix.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: List settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          Z=80f50005716163bcb63efdeb39936045
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$Z/settings" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s);for(const r of d.result||[]) console.log(r.id, '=', r.value)})" | grep -i "bot\|fight\|security\|challenge\|ua"
