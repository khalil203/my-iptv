name: CF fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cf-fix.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Disable bot fight mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          Z=80f50005716163bcb63efdeb39936045
          echo "bot_fight_mode:"
          curl -s -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/$Z/settings/bot_fight_mode" -d '{"value":"off"}'
          echo
          echo "super_bot_fight_mode:"
          curl -s -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/$Z/settings/super_bot_fight_mode" -d '{"value":{"enabled":false}}'
          echo
          echo "done"
