# Read-only health check of the live app. Prints a redacted summary only (no names, emails, passwords, keys or addresses).
name: Diagnose (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/diagnose.mjs', '.github/workflows/diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Download saved data (kept on the runner only, never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/diag
          ID=$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const n=l.find(x=>x.title==='my-iptv-db')||l.find(x=>/my-iptv/.test(x.title));console.log(n?n.id:'')})")
          test -n "$ID" || { echo "storage not found"; exit 1; }
          for k in settings customers admin team log; do npx wrangler kv key get "$k" --namespace-id "$ID" --remote > /tmp/diag/$k.json 2>/dev/null || echo "null" > /tmp/diag/$k.json; done
          wc -c /tmp/diag/*.json
      - name: Diagnose
        run: node tools/diagnose.mjs
      - name: Repro login
        run: node tools/repro-login.mjs
      - name: Tail worker and trigger login
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler tail --format pretty > /tmp/tail.txt 2>&1 &
          TAILPID=$!
          sleep 10
          curl -s -X POST https://intproto-tv.store/api/login -H 'Content-Type: application/json' -d '{"username":"Iptv","password":"Iptv"}'
          echo
          sleep 10
          kill $TAILPID 2>/dev/null || true
          echo "===== TAIL ====="
          cat /tmp/tail.txt
      - name: Unblock IPs (delete rl: keys)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID=$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const n=l.find(x=>x.title==='my-iptv-db')||l.find(x=>/my-iptv/.test(x.title));console.log(n?n.id:'')})")
          echo "NS=$ID"
          npx wrangler kv key list --namespace-id "$ID" --prefix "rl:" --remote | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s);for(const k of a) console.log(k.name)}catch{}})" > /tmp/keys.txt
          echo "Found $(wc -l < /tmp/keys.txt) keys"
          while read -r k; do [ -z "$k" ] && continue; npx wrangler kv key delete "$k" --namespace-id "$ID" --remote && echo "deleted $k"; done < /tmp/keys.txt
          echo "done"
      - name: Unblock IPs (delete rl: keys)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID=$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const n=l.find(x=>x.title==='my-iptv-db')||l.find(x=>/my-iptv/.test(x.title));console.log(n?n.id:'')})")
          echo "NS=$ID"
          npx wrangler kv key list --namespace-id "$ID" --prefix "rl:" --remote | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s);for(const k of a) console.log(k.name)}catch{}})" > /tmp/keys.txt
          echo "Found $(wc -l < /tmp/keys.txt) keys"
          while read -r k; do [ -z "$k" ] && continue; npx wrangler kv key delete "$k" --namespace-id "$ID" --remote && echo "deleted $k"; done < /tmp/keys.txt
          echo "done"
      - name: Remove downloaded data
        if: always()
        run: rm -rf /tmp/diag
