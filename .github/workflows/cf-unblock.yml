name: Cloudflare unblock
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cf-unblock.yml']
permissions:
  contents: read
jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: List zones and access rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== ZONES ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones" | head -c 2000
          echo
          echo "=== ACCOUNTS ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | head -c 1000
