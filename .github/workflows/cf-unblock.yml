name: Cloudflare unblock
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cf-unblock.yml']
permissions:
  contents: read
jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: List and delete IP access rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE=80f50005716163bcb63efdeb39936045
          echo "=== ZONE ACCESS RULES ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/firewall/access_rules/rules?per_page=100" > /tmp/rules.json
          cat /tmp/rules.json | head -c 2000
          echo
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/rules.json','utf8'));const r=d.result||[];console.log('count',r.length);for(const x of r) console.log(x.id, x.mode, x.configuration?.target, x.configuration?.value);" > /tmp/rulelist.txt
          cat /tmp/rulelist.txt
          while read -r id mode target value; do [ -z "$id" ] && continue; echo "Deleting $id ($mode $value)"; curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/firewall/access_rules/rules/$id" | head -c 200; echo; done < /tmp/rulelist.txt
          echo "=== ACCOUNT ACCESS RULES ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/a41be2c27cf1c7264d3e6bc0d15ab6d4/firewall/access_rules/rules?per_page=100" > /tmp/acct.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/acct.json','utf8'));const r=d.result||[];console.log('count',r.length);for(const x of r) console.log(x.id, x.mode, x.configuration?.target, x.configuration?.value);" > /tmp/acctlist.txt
          cat /tmp/acctlist.txt
          while read -r id mode target value; do [ -z "$id" ] && continue; echo "Deleting $id ($mode $value)"; curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/a41be2c27cf1c7264d3e6bc0d15ab6d4/firewall/access_rules/rules/$id" | head -c 200; echo; done < /tmp/acctlist.txt
          echo "done"
