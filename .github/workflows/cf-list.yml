name: CF list
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cf-list.yml']
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List firewall/waf rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          Z=80f50005716163bcb63efdeb39936045
          echo "=== legacy firewall rules ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$Z/firewall/rules?per_page=100" | head -c 2000
          echo
          echo "=== waf overrides ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$Z/waf/overrides" | head -c 2000
          echo
          echo "=== rate limits ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$Z/rate_limits" | head -c 2000
          echo
          echo "=== security events (recent) ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$Z/security/events?limit=10" | head -c 2000
          echo
