# Deploys the real app (with admin, customers, API and proxy) to Cloudflare Workers — free plan.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README).
name: Deploy to Cloudflare (free)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "Cloudflare secrets not set yet - skipping deploy."; echo "skip=1" >> $GITHUB_OUTPUT; fi
      - name: Install
        if: steps.check.outputs.skip != '1'
        run: npm ci
      - name: Create KV storage (first run only) and set it in wrangler.toml
        if: steps.check.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID=$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const n=l.find(x=>x.title==='my-iptv-db');console.log(n?n.id:'')})")
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create my-iptv-db > /dev/null
            ID=$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);console.log(l.find(x=>x.title==='my-iptv-db').id)})")
          fi
          sed -i "s/PASTE_YOUR_KV_NAMESPACE_ID_HERE/$ID/" wrangler.toml
          echo "Using KV namespace $ID"
      - name: Deploy
        if: steps.check.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
