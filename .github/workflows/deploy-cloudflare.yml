# Builds the Android / Android TV app, then deploys everything to Cloudflare Workers (free plan).
# Needs repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare (free)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  APP_URL: ${{ vars.APP_URL || 'https://my-iptv.mrkhalil-ben-salah.workers.dev' }}
jobs:
  android:
    name: Build Android & Android TV app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android assembleRelease -PappUrl="$APP_URL" -PversionCode=${{ github.run_number }} --no-daemon -q
      - name: Collect APK
        run: mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/INTPROTO-TV.apk && ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/INTPROTO-TV.apk
      - name: Publish on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: INTPROTO-TV Android & Android TV app
          body: Install on Android phones, tablets, Android TV, TV boxes and Fire TV. The app updates itself automatically — you only install it once.
          files: out/INTPROTO-TV.apk
          make_latest: true

  deploy:
    name: Deploy app to Cloudflare
    needs: android
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add the Android app to the website
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: public/apk
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "Cloudflare secrets not set yet - skipping deploy."; echo "skip=1" >> $GITHUB_OUTPUT; fi
      - name: Install
        if: steps.check.outputs.skip != '1'
        run: npm ci
      - name: Create KV storage (first run only) and set it in wrangler.toml
        if: steps.check.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID=$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const n=l.find(x=>x.title==='my-iptv-db');console.log(n?n.id:'')})")
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create my-iptv-db > /dev/null
            ID=$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);console.log(l.find(x=>x.title==='my-iptv-db').id)})")
          fi
          sed -i "s/PASTE_YOUR_KV_NAMESPACE_ID_HERE/$ID/" wrangler.toml
          echo "Using KV namespace $ID"
      - name: Deploy
        if: steps.check.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
