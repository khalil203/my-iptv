# Diagnostic: can a normal data-centre server (GitHub / Microsoft Azure) reach the IPTV server? Does it allow browsers (CORS)?
name: IPTV server check
on:
  push:
    paths: ['.github/server-check.txt']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test IPTV server
        run: |
          set +e; read SERVER USER PASS X < .github/server-check.txt
          echo "== player_api headers"; curl -s -D - -o /tmp/b -m 20 -A "IPTVSmartersPro" -H "Origin: https://example.com" "$SERVER/player_api.php?username=$USER&password=$PASS&action=get_live_streams" | grep -i -E "^HTTP|access-control|content-type|server"
          ID=$(python3 -c "import json;d=json.load(open('/tmp/b'));print(d[0]['stream_id'])" 2>/dev/null); echo "first stream id: $ID"
          echo "== live m3u8"; curl -s -D - -o /tmp/m -m 20 -L -A "IPTVSmartersPro" -H "Origin: https://example.com" "$SERVER/live/$USER/$PASS/$ID.m3u8" | grep -i -E "^HTTP|access-control|content-type|location"; head -c 300 /tmp/m; echo
          SEG=$(grep -v '^#' /tmp/m | head -1); echo "segment: ${SEG:0:90}"
          echo "== https?"; curl -s -o /dev/null -w "https %{http_code}\n" -m 10 "https://${SERVER#http://}/player_api.php?username=$USER&password=$PASS" || true
