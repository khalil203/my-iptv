# Diagnostic: channel logo check on the IPTV server
name: IPTV server check
on:
  push:
    paths: ['.github/server-check.txt']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check channel logos
        run: |
          set +e; read SERVER USER PASS X < .github/server-check.txt
          curl -s -m 60 -A "IPTVSmartersPro" "$SERVER/player_api.php?username=$USER&password=$PASS&action=get_live_streams" -o live.json
          curl -s -m 60 -A "IPTVSmartersPro" "$SERVER/player_api.php?username=$USER&password=$PASS&action=get_vod_streams" -o vod.json
          python3 - <<'PY'
          import json, collections, urllib.parse, urllib.request, random
          for f in ['live.json','vod.json']:
              try: d=json.load(open(f))
              except Exception as e: print(f,'not json',e); continue
              icons=[x.get('stream_icon') or '' for x in d]
              have=[i for i in icons if i.strip()]
              print(f'== {f}: {len(d)} items, with logo: {len(have)} ({100*len(have)//max(1,len(d))}%), empty: {len(d)-len(have)}')
              print('   http:',sum(1 for i in have if i.startswith('http:')),' https:',sum(1 for i in have if i.startswith('https:')))
              print('   logo hosts:', collections.Counter(urllib.parse.urlparse(i).netloc for i in have).most_common(6))
              ok=0; sample=random.sample(have, min(15,len(have)))
              for u in sample:
                  try:
                      r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=8); ok+= r.status==200 and r.headers.get('content-type','').startswith('image')
                  except Exception: pass
              print(f'   sample of {len(sample)} logo links: {ok} load OK, {len(sample)-ok} broken')
              print('   examples without logo:', [x.get('name') for x in d if not (x.get('stream_icon') or '').strip()][:5])
          PY
