# Diagnostic: logos of USA channels
name: IPTV server check
on:
  push:
    paths: ['.github/server-check.txt']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check USA channel logos
        run: |
          set +e; read SERVER USER PASS X < .github/server-check.txt
          curl -s -m 90 -A "IPTVSmartersPro" "$SERVER/player_api.php?username=$USER&password=$PASS&action=get_live_streams" -o live.json
          python3 - <<'PY'
          import json, urllib.request, collections
          d=json.load(open('live.json'))
          usa=[x for x in d if str(x.get('name','')).startswith('USA - CW') or 'WGN9' in str(x.get('name',''))][:12]
          for x in usa:
              u=(x.get('stream_icon') or '').strip(); st='-'
              if u:
                  try:
                      r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=8); st=f"{r.status} {r.headers.get('content-type')}"
                  except Exception as e: st=str(e)[:40]
              print('LOGO', x['name'][:28], '|', u[:70] or '(none)', '|', st)
          icons=[(x.get('stream_icon') or '').strip() for x in d]
          print('STATS total',len(d),'empty',sum(1 for i in icons if not i))
          PY
