# Builds the Windows and Mac apps and publishes them on GitHub Releases (tag "desktop").
name: Desktop apps (Windows & Mac)
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --publish never
      - name: Publish on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          name: INTPROTO-TV for Windows & Mac
          body: |
            Install INTPROTO-TV on your computer. The app updates itself automatically — install it only once.
            • Windows: download INTPROTO-TV-Windows-Setup.exe and open it (if Windows warns, click "More info" → "Run anyway").
            • Mac: download INTPROTO-TV-Mac-arm64.dmg (Apple chip) or INTPROTO-TV-Mac-x64.dmg (Intel), drag the app to Applications, then right-click it → Open (or System Settings → Privacy & Security → Open Anyway).
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
