name = "my-iptv"
main = "worker/worker.js"
compatibility_date = "2025-06-01"

# Keep the workers.dev address on: the installed apps open it. Without this line,
# adding routes below switches it off and the apps show "There is nothing here yet".
workers_dev = true

# Your own domain (its DNS is on Cloudflare; records stay "Proxied")
routes = [
  { pattern = "intproto-tv.store/*", zone_name = "intproto-tv.store" },
  { pattern = "www.intproto-tv.store/*", zone_name = "intproto-tv.store" }
]

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "DB"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

[triggers]
crons = ["0 2 * * *"]
