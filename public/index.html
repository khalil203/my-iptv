<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>INTPROTO-TV</title>
  <meta name="theme-color" content="#0B0B0F">
  <meta name="apple-mobile-web-app-title" content="INTPROTO-TV">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>/* pick day/night before anything shows */try{var m=localStorage.getItem("tvp_theme")||"auto",hr=new Date().getHours();document.documentElement.dataset.theme=m==="auto"?(hr>=6&&hr<18?"light":"dark"):m}catch(e){}</script>
</head>
<body>
  <div id="app"><div class="boot" style="display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:16px;box-sizing:border-box"><div style="position:relative;width:min(110px,30vw);height:min(110px,30vw)"><img src="logo.png" alt="INTPROTO-TV" style="position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 0 30px color-mix(in srgb, var(--primary) 60%, transparent)"><div style="position:absolute;inset:0;margin:auto;width:100%;height:100%;border-radius:50%;border:6px solid var(--line2,#2A2A33);border-top-color:var(--primary,#FF6B42);animation:spin 900ms linear infinite"></div></div><div style="margin-top:14px;color:var(--muted,#BCBAAF);font:600 15px Inter,system-ui,sans-serif;letter-spacing:.04em;max-width:90vw">INTPROTO-TV</div></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style></div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
