<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="INTPROTO-TV — live TV, movies and series in one simple app, on phone, TV and desktop.">
  <meta name="color-scheme" content="dark light">
  <title>INTPROTO-TV</title>
  <meta name="theme-color" content="#050C0E">
  <meta name="apple-mobile-web-app-title" content="INTPROTO-TV">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=71">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <script>/* pick day/night before anything shows */try{var m=localStorage.getItem("tvp_theme")||"auto",hr=new Date().getHours();document.documentElement.dataset.theme=m==="auto"?(hr>=6&&hr<18?"light":"dark"):m}catch(e){}</script>
</head>
<body>
  <nav aria-label="Skip to content"><a class="skip-link" href="#main">Skip to content</a></nav>
  <div id="app"><div class="boot">
    <div class="boot-nebula"></div>
    <div class="boot-stage">
      <div class="boot-ring r1"></div>
      <div class="boot-ring r2"></div>
      <img class="boot-logo" src="logo.png" alt="INTPROTO-TV">
    </div>
    <div class="boot-word">INTPROTO-TV</div>
    <div class="boot-sub">LIVE&nbsp;TV&nbsp;&nbsp;·&nbsp;&nbsp;MOVIES&nbsp;&nbsp;·&nbsp;&nbsp;SERIES</div>
    <div class="boot-bar"><i></i></div>
  </div><style>
.boot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:100vh;min-height:100dvh;padding:20px;box-sizing:border-box;overflow:hidden;background:radial-gradient(120vmax 70vmax at 15% -10%,rgba(0,194,209,.32),transparent 60%),radial-gradient(120vmax 70vmax at 90% 115%,rgba(34,211,238,.28),transparent 62%),#050C0E;font-family:Inter,system-ui,-apple-system,sans-serif}
.boot-nebula{position:absolute;inset:-20%;background:radial-gradient(40vmax 40vmax at 30% 35%,rgba(8,145,178,.26),transparent 70%),radial-gradient(45vmax 45vmax at 70% 65%,rgba(34,211,238,.20),transparent 70%);animation:neb 16s ease-in-out infinite alternate;pointer-events:none}
@keyframes neb{to{transform:translate(6%,5%) scale(1.12)}}
.boot-stage{position:relative;width:min(150px,42vw);height:min(150px,42vw);display:grid;place-items:center}
.boot-logo{width:62%;height:62%;object-fit:cover;border-radius:50%;z-index:1;animation:breath 2.6s ease-in-out infinite;box-shadow:0 0 34px rgba(0,194,209,.55),0 0 80px rgba(34,211,238,.32)}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.boot-ring{position:absolute;border-radius:50%}
.r1{inset:0;border:5px solid rgba(34,211,238,.16);border-top-color:#22D3EE;border-right-color:#00A8B5;animation:spin 1.05s cubic-bezier(.65,.15,.35,.85) infinite;filter:drop-shadow(0 0 10px rgba(0,194,209,.5))}
.r2{inset:13%;border:1px dashed rgba(34,211,238,.45);animation:spin 4.5s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-word{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:900;letter-spacing:.14em;color:#fff;background:linear-gradient(110deg,#fff 0%,#CFFAFE 30%,#22D3EE 55%,#00A8B5 75%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sweep 3s linear infinite}
@keyframes sweep{to{background-position:220% 0}}
.boot-sub{font-size:.68rem;font-weight:800;letter-spacing:.28em;color:rgba(207,250,254,.6)}
.boot-bar{position:relative;width:min(220px,60vw);height:4px;border-radius:99px;background:rgba(34,211,238,.18);overflow:hidden}
.boot-bar i{position:absolute;top:0;bottom:0;width:38%;border-radius:99px;background:linear-gradient(90deg,transparent,#22D3EE 25%,#00A8B5 75%,transparent);animation:bar 1.5s cubic-bezier(.5,.1,.3,.9) infinite}
@keyframes bar{from{left:-40%}to{left:110%}}
@media (prefers-reduced-motion:reduce){.boot-ring,.boot-logo,.boot-word,.boot-bar i,.boot-nebula{animation:none}}
</style></div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <script type="module" src="app.js?v=71"></script>
</body>
</html>
