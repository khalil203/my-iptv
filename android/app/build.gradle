plugins { id 'com.android.application' }

def appUrl = project.findProperty('appUrl') ?: 'https://my-iptv.mrkhalil-ben-salah.workers.dev'
def vCode = (project.findProperty('versionCode') ?: '1').toInteger()

android {
    namespace 'tv.intproto.app'
    compileSdk 34
    defaultConfig {
        applicationId 'tv.intproto.app'
        minSdk 21
        targetSdk 34
        versionCode vCode
        versionName "1.${vCode}"
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file('intproto.keystore')
            storePassword 'intproto-tv'
            keyAlias 'intproto'
            keyPassword 'intproto-tv'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
